name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
        env:
          PII_BLOCKED_WORDS: ${{ secrets.PII_BLOCKED_WORDS }}
          REQUIRE_BLOCKED_WORDS: ${{ github.event_name == 'push' && '1' || '' }}
