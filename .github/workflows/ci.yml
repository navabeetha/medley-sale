name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
        env:
          PII_BLOCKED_WORDS: ${{ secrets.PII_BLOCKED_WORDS }}
          REQUIRE_BLOCKED_WORDS: ${{ github.event_name == 'push' && '1' || '' }}

  # D-031 rule 6: the photo tool's Python tests, separate from `npm run check`
  # so running the gate locally does not need a Python venv.
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: tools/photos/requirements.txt
      - run: pip install -r tools/photos/requirements.txt
      - run: python -m pytest tools/photos -q
